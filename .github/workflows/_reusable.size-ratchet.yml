name: _reusable - size ratchet

# Caller grants contents: read for PRs and contents: write for default-branch
# pushes. PR validation never runs repository code or receives a write token.
# Keep the caller required and protect its workflow/tool revision with review.
on:
  workflow_call:
    inputs:
      script-ref:
        description: "infra-public revision containing size_ratchet.py. Pin a reviewed commit SHA."
        required: true
        type: string
      policy:
        description: "Repository-relative JSON policy; read from the base commit only."
        required: false
        type: string
        default: ".size-ratchet.json"
      records:
        description: "Repository-relative JSON records; read from the base commit only."
        required: false
        type: string
        default: ".size-ratchet-records.json"

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: _repo
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: quadseven/infra-public
          ref: ${{ inputs.script-ref }}
          sparse-checkout: .github/scripts/size_ratchet.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
          path: _tool
      - name: Check trusted base records
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          POLICY: ${{ inputs.policy }}
          RECORDS: ${{ inputs.records }}
        run: |
          python3 _tool/.github/scripts/size_ratchet.py check --repo _repo --base "$BASE" --head "$HEAD" --policy "$POLICY" --records "$RECORDS"

  lower:
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: _repo
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: quadseven/infra-public
          ref: ${{ inputs.script-ref }}
          sparse-checkout: .github/scripts/size_ratchet.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
          path: _tool
      - name: Lower and commit records
        working-directory: _repo
        env:
          BASE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
          POLICY: ${{ inputs.policy }}
          RECORDS: ${{ inputs.records }}
          BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 ../_tool/.github/scripts/size_ratchet.py lower --base "$BASE" --head "$HEAD" --policy "$POLICY" --records "$RECORDS"
          if git diff --quiet -- "$RECORDS"; then
            exit 0
          fi
          git add -- "$RECORDS"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Lower size ratchet records'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$BRANCH"
