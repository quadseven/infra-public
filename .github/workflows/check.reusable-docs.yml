name: check - reusable workflow docs

# docs/reusables.md is generated from every reusable's workflow_call block by
# .github/scripts/reusable_docs.py (infra-public#137). This fails a PR that
# changes a reusable's inputs, secrets or outputs, or which PR workflows run
# it, without regenerating the page, so the page a stranger reads cannot
# drift from what the workflow accepts. The same job holds README.md to the
# public README standard (templates/public-repo/README-STANDARD.md,
# #179).

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/scripts/**"
      - "docs/reusables.md"
      - "README.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "docs/reusables.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - name: "Unit tests for the docs generator"
        run: python3 .github/scripts/reusable_docs_test.py
      - name: "The reusables reference is current"
        run: python3 .github/scripts/reusable_docs.py --check
      - name: "README follows the public README standard"
        run: python3 .github/scripts/readme_standard_test.py
