name: check - size ratchet

on:
  pull_request:
    paths:
      - ".github/scripts/size_ratchet*"
      - ".github/scripts/deploy_k8s_steps_test.py"
      - ".github/workflows/*size-ratchet.yml"
      - "examples/size-ratchet/**"
  push:
    branches: [main]
    paths:
      - ".github/scripts/size_ratchet*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - name: Unit suite for the size ratchet
        run: python3 .github/scripts/size_ratchet_test.py
