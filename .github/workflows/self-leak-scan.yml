name: leak-scan

# Thin caller for this repo's own reusable leak scan - infra-public eats its
# own cooking before any other repo is asked to adopt it, the same way
# self-sync.public-repo-docs.yml does for the docs sync. See
# _reusable.leak-scan.yml for the mechanism and for what a consuming repo's
# caller looks like.
#
# `edited` is in the trigger list on purpose: the PR title and body are
# scanned too, and a body can leak long after the last push.
#
# `issues` is in the trigger list for the same reason a diff alone was never
# enough for PRs (infra-public#74/#71): a leak written into an ISSUE body -
# including one filed by automation, which is how #71's happened - has no
# diff and no PR to gate. `issues: write` below is used ONLY on that path, to
# comment a finding back onto the issue; the pull_request path never touches
# it and stays read-only.
#
# The `uses:` pin below is a commit on the branch that introduced this file,
# because a workflow cannot pin a SHA that does not exist yet. Bump it to the
# merge commit once this lands, the same as any other pin here.
#
# allowed-repo-refs: this repo cites the private tracker's issue numbers by
# convention - `infra#1234` appears in nearly every workflow header here and
# in the sync workflow's PR body - so those refs are exempted rather than
# blocked. Whether that convention should change is a separate call; blocking
# it here would only mean this guard gets switched off. This repo's own
# `infra-public#123` refs are always exempt and need no entry.
#
# DENY-LIST LAYER, PR runs only. Terms with no generic shape (people,
# products, projects) are read at run time from the SSM parameter below,
# through the role in the LEAK_SCAN_ROLE_ARN secret. That role can read this
# one parameter and nothing else, and trusts only pull_request runs of the
# public repos that share it. An `issues` run carries a branch subject, not a
# pull_request one, so it cannot assume the role: passing the parameter there
# would make every issue scan fail closed on an AccessDenied. The parameter is
# therefore set on pull_request only, and issue runs keep the generic shapes.
# The terms never live in this repo, the log shows only how many were
# loaded, and a hit is redacted. A fork PR gets no secrets, so the scan fails
# closed there rather than running without the list.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  issues:
    types: [opened, edited]

jobs:
  leak-scan:
    uses: quadseven/infra-public/.github/workflows/_reusable.leak-scan.yml@273755079c88172df39501ee6914fd878c0920bc
    permissions:
      contents: read
      issues: write
      # Mint the OIDC token for the deny-list read role (PR runs).
      id-token: write
    with:
      allowed-repo-refs: infra
      # This repo IS the scanner's home, so a PR scans with the tree under
      # review rather than with main: a change to the patterns is exercised
      # by the guard it changes, in the PR that changes it. Consumer repos
      # leave this alone and take main. An `issues` event has no PR and
      # therefore no head sha - github.event.pull_request.head.sha is null
      # there, which the `||` falls back from, same as it always has for main.
      scanner-ref: ${{ github.event.pull_request.head.sha || 'main' }}
      deny-list-ssm-param: ${{ github.event_name == 'pull_request' && '/infra/leak-scan/deny-list' || '' }}
    secrets:
      aws-role-arn: ${{ secrets.LEAK_SCAN_ROLE_ARN }}
