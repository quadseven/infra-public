name: sync · public-repo docs

# Keeps a consuming repo's root-level AGENTS.md and CLAUDE.md in sync with the
# canonical copies at quadseven/infra-public/templates/public-repo/. Those two
# files are the public-repo write policy (infra#2953): every quadseven public
# repo should carry the same rules rather than a hand-copied, drifting
# duplicate. This workflow diffs the calling repo's copies against the
# canonical ones and opens a normal PR with the update when they differ (or
# don't exist yet) - nothing auto-merges, the target repo's own required
# checks (Grug's DoR gate where present) apply same as any other PR.
#
# A target can carry its own content without freezing the shared policy. Both
# templates end with a `<!-- repo-specific below -->` line. When a target file
# has that line, only the part above it is replaced with the current template,
# and everything from that line down is kept byte-for-byte. A target without
# the line is replaced only if it is byte-identical to some published template
# version; anything else is left alone, with a warning that says how to adopt
# the marker (infra#3803).
#
# Consumed cross-repo as
# uses: quadseven/infra-public/.github/workflows/sync.public-repo-docs.yml@<sha>
# Caller grants contents: write, pull-requests: write.
#
# Example caller (5-line thin wrapper in the consuming repo):
#   on:
#     schedule: [{cron: "17 6 * * 1"}]
#     workflow_dispatch: {}
#   jobs:
#     sync:
#       uses: quadseven/infra-public/.github/workflows/sync.public-repo-docs.yml@<sha>
#       permissions: { contents: write, pull-requests: write }

on:
  workflow_call:
    inputs:
      runner:
        description: "Runner label/pool (caller picks per tier policy)."
        required: false
        type: string
        default: "ubuntu-latest"
      branch:
        description: "Branch name used for the sync PR."
        required: false
        type: string
        default: "chore/sync-public-repo-docs"
      pr_label:
        description: "Label applied to the opened PR. Skipped silently if the label doesn't exist in the target repo."
        required: false
        type: string
        default: "chore"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    steps:
      - name: Checkout target repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          path: target

      - name: Checkout canonical docs
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: quadseven/infra-public
          sparse-checkout: templates/public-repo
          sparse-checkout-cone-mode: false
          # Full history: the guard below needs every published version of each
          # template to tell a never-customized file from repo-specific content.
          fetch-depth: 0
          path: canonical

      - name: Diff and stage update
        id: diff
        run: |
          set -euo pipefail
          marker='<!-- repo-specific below -->'
          changed=false
          for f in AGENTS.md CLAUDE.md; do
            canon="canonical/templates/public-repo/$f"
            tgt="target/$f"
            if cmp -s "$canon" "$tgt" 2>/dev/null; then
              continue
            fi
            if [ ! -e "$tgt" ]; then
              cp "$canon" "$tgt"
              changed=true
              continue
            fi
            # A target with the marker line: the current template's text above
            # ITS marker, then the target from its marker line down. head and
            # tail keep bytes exactly (awk would add a missing final newline).
            # `|| true` because grep finding no marker is not a failure here.
            tgt_mark=$(grep -nxF -m1 -- "$marker" "$tgt" | cut -d: -f1 || true)
            if [ -n "$tgt_mark" ]; then
              canon_mark=$(grep -nxF -m1 -- "$marker" "$canon" | cut -d: -f1 || true)
              {
                if [ -n "$canon_mark" ]; then head -n "$((canon_mark - 1))" "$canon"; else cat "$canon"; fi
                tail -n +"$tgt_mark" "$tgt"
              } > "$tgt.synced"
              if cmp -s "$tgt.synced" "$tgt"; then
                rm -f "$tgt.synced"
              else
                mv "$tgt.synced" "$tgt"
                changed=true
              fi
              continue
            fi
            # No marker: replace only a file byte-identical to SOME published template
            # version: the repo never customized it. Anything else is
            # repo-specific, and cp would delete it (mod-overseer#110 was a
            # +0/-122 deletion). Blob ids are collected before grep so that
            # grep -q exiting early cannot fail the pipeline under pipefail.
            tgt_blob=$(git hash-object --no-filters "$tgt")
            known=$(git -C canonical log --format=%H -- "templates/public-repo/${f}" \
              | while read -r c; do git -C canonical rev-parse "${c}:templates/public-repo/${f}" 2>/dev/null || true; done)
            if grep -qx "$tgt_blob" <<<"$known"; then
              cp "$canon" "$tgt"
              changed=true
            else
              echo "::warning title=${f} not synced::${f} has repo-specific content and no '${marker}' line, so infra-public policy updates will NOT reach this file. To fix: put the current template at the top, then that line, then this repo's own content. From then on only the part above the line is synced (infra#3803)."
            fi
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Open sync PR
        if: steps.diff.outputs.changed == 'true'
        working-directory: target
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ inputs.branch }}
          LABEL: ${{ inputs.pr_label }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add AGENTS.md CLAUDE.md
          if git diff --cached --quiet; then
            echo "nothing staged after add - already in sync"
            exit 0
          fi

          git checkout -B "$BRANCH"
          git commit -m "chore: sync AGENTS.md/CLAUDE.md from infra-public canonical copy"
          git push -f origin "$BRANCH"

          body=$(cat <<'EOF'
          ## Why

          This repo's AGENTS.md/CLAUDE.md have drifted from the canonical
          public-repo policy at quadseven/infra-public/templates/public-repo/.
          Those two files encode what may never be written into
          a public repo's issues, PRs, comments, or code - keeping every
          public repo on the same copy, rather than a hand-maintained
          duplicate, is the whole point of this sync workflow.

          ## What

          Replaces the synced part of this repo's root AGENTS.md and CLAUDE.md
          with the current canonical text. The synced part is everything above
          a `<!-- repo-specific below -->` line, or the whole file if it has no
          such line. Anything from that line down is kept as it is.

          ## Acceptance criteria

          - [ ] AGENTS.md above the marker line matches quadseven/infra-public's canonical copy byte-for-byte
          - [ ] CLAUDE.md above the marker line matches quadseven/infra-public's canonical copy byte-for-byte
          - [ ] Nothing from a marker line down, and no other file in this repo, is touched

          ## Out of scope

          - Any other repo-specific documentation
          - The canonical policy's own content, which is edited in infra-public, not here

          ## Estimate

          Size: XS
          EOF
          )

          existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' || true)
          if [[ -n "$existing" && "$existing" != "null" ]]; then
            gh pr edit "$existing" --body "$body"
            exit 0
          fi

          if ! gh pr create --title "chore: sync AGENTS.md/CLAUDE.md from infra-public" \
              --body "$body" --head "$BRANCH" --label "$LABEL"; then
            echo "retrying PR create without --label (label may not exist in this repo)" >&2
            gh pr create --title "chore: sync AGENTS.md/CLAUDE.md from infra-public" \
              --body "$body" --head "$BRANCH"
          fi
