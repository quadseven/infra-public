# The repository validation contract (infra-public#120).
#
# What a lane runs, in order, before it opens a pull request against this
# repository. One command per line:
#
#     <kind> | <command> | <workflow file> | <step name>
#
# The two fields after the command are not decoration: each command is a run
# step of a pull-request workflow in this tree, named so a reader can go read
# it. `python3 .github/scripts/validation_contract.py` fails if any line
# names a workflow that is not pull_request-triggered, a step that does not
# exist, or a step that does not run that command; `--run` additionally runs
# every command here and fails if one goes red. So this file cannot quietly
# drift from CI in either direction.
#
# A command is one command, run directly - not a shell script. `--run` splits
# it into arguments and executes it, never through a shell, so a line carrying
# `&&`, a redirect or a `$(...)` is refused. A step that runs several commands
# gets one line per command; quotes are honored, so
# `python3 -c "print(1)"` is one command with one argument.
#
# `kind` is one of lint, format, type, test, and the kinds appear in that
# order, so reading top to bottom is the order to run them in. A kind with no
# command in this repository is absent rather than invented:
#
#   format  No workflow here runs a format check as its own step. The ruff
#           format --check for python/spark_cave is bundled into the reusable
#           .github/workflows/check.python.yml step "Ruff check + format
#           --check", whose command is assembled from the caller's inputs, so
#           there is no literal run step to name here. The same reusable runs
#           ruff and pytest for that package (via check.spark-cave.yml); run
#           `uvx ruff@0.15.10 check . && uvx ruff@0.15.10 format --check . &&
#           uv run --frozen pytest -q` from python/spark_cave when you touch it.
#   type    Nothing type-checks this repository: no mypy or pyright
#           configuration, no type step in any workflow, and the package
#           targets py311 through ruff only.
#
# Adding a command here means CI runs it (check.loom-validation.yml, the
# `--run` step), exactly as adding it to a workflow would - both are
# review-visible. Commands are run from the repository root.

